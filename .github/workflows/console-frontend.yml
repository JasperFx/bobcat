name: console frontend

# Typecheck + Vitest gate for the Bobcat.Console Vue SPA, mirroring CritterWatch's
# frontend-unit workflow. Runs only when the frontend actually changed — the monitor
# UI leans entirely on vitest until the Bobcat Gherkin runner is dogfooded for e2e.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/Bobcat.Console.FrontEnd/**'
      # The SPA consumes @jasperfx/event-model-vue as a file: dependency (issue #108), so a
      # package change must re-gate the SPA too.
      - 'src/Bobcat.EventModel.FrontEnd/**'
      - '.github/workflows/console-frontend.yml'

env:
  CI: true

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Bobcat.Console.FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The @jasperfx/event-model-vue file: dependency resolves to its dist/, which is
      # gitignored — so the package must be built before the SPA can typecheck or test.
      - name: Build @jasperfx/event-model-vue
        working-directory: src/Bobcat.EventModel.FrontEnd
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b

      - name: Unit tests (Vitest)
        run: npx vitest run
