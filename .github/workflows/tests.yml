name: tests

# Build and run the full Bobcat test suite on every push to any branch.
on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    # The Marten integration tests exercise the [MartenEntities] persistence recipe against a
    # real database. They are never skipped here — see PostgresFactAttribute: the skip only
    # applies off-CI, so a missing database on CI is a failure rather than a silent pass.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bobcat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # A REAL broker for the transport-isolation tests (issue #282). The defect they pin —
      # messages a scenario cascaded surviving the per-scenario reset and being delivered inside
      # the NEXT scenario — has nowhere to happen on an in-memory transport, which is exactly why
      # it shipped: every sample either stubs the transport or does not cascade across one inside a
      # scenario. RabbitFactAttribute skips off-CI without Docker and never here, for the same
      # reason PostgresFactAttribute does not: a silent pass would rebuild the blind spot.
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5683:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      BOBCAT_POSTGRES: "Host=localhost;Port=5445;Database=bobcat_test;Username=postgres;Password=postgres"
      BOBCAT_RABBIT_HOST: "localhost"
      BOBCAT_RABBIT_PORT: "5683"
      # Bobcat.Console.Specs (the viewer's end-to-end suite, collected by `dotnet test` below) is
      # itself a Bobcat spec host, and a spec host publishes its own progress to a viewer on
      # localhost:5525 when one answers. Nothing listens there on CI, so this only spares the
      # probe — but it makes "the suite does not publish while it tests a viewer" a stated fact
      # rather than an accident of which ports happen to be open.
      BOBCAT_MONITOR: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # Bobcat specs running THROUGH `dotnet test` is a supported path, and the root run above
      # covers it only implicitly: Bobcat.Console.Specs is collected because it sets the MTP
      # test-host properties by hand. If that wiring ever broke, the specs would drop out of
      # the root run and this job would stay green. This targeted run makes the path a stated
      # fact — and the grep refuses a run that collected zero tests, which `dotnet test` does
      # not reliably treat as a failure.
      - name: Bobcat specs through dotnet test
        shell: bash
        run: |
          set -o pipefail
          dotnet test src/Bobcat.Console.Specs --no-build -c Release | tee specs-via-dotnet-test.log
          grep -E "Total: [1-9][0-9]*" specs-via-dotnet-test.log

      # The MSBuild integration of Microsoft.Testing.Platform prints only "Failed: N" to the
      # console and writes the failing tests' names and assertions to each project's
      # TestResults/*.log. Keep those when the job is red, or the name of the failing test is
      # something a reader has to reproduce locally to learn.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.log'
          if-no-files-found: ignore
