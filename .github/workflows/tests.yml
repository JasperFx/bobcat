name: tests

# Build and run the full Bobcat test suite on every push to any branch.
on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    # The Marten integration tests exercise the [MartenEntities] persistence recipe against a
    # real database. They are never skipped here — see PostgresFactAttribute: the skip only
    # applies off-CI, so a missing database on CI is a failure rather than a silent pass.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bobcat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BOBCAT_POSTGRES: "Host=localhost;Port=5445;Database=bobcat_test;Username=postgres;Password=postgres"
      # A Bobcat spec host publishes its own progress to a monitor when one answers. Nothing
      # listens on CI, so this only spares the probe — but it makes "the suite does not publish
      # while it tests" a stated fact rather than an accident of which ports happen to be open.
      BOBCAT_MONITOR: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Nuke build's CI target (build/Build.cs) is the whole job: restore, Release build, the
      # full suite, then Bobcat specs THROUGH `dotnet test` against Bobcat.Mtp.GeneratedHost —
      # the supported path the root run covers only implicitly, guarded so a run that collected
      # zero tests fails (`dotnet test` does not reliably treat that as a failure). One definition,
      # so `./build.sh CI` on a laptop means what it means here. The services above stand in for
      # the Docker target.
      - name: Build and test
        run: ./build.sh CI

      # The MSBuild integration of Microsoft.Testing.Platform prints only "Failed: N" to the
      # console and writes the failing tests' names and assertions to each project's
      # TestResults/*.log. Keep those when the job is red, or the name of the failing test is
      # something a reader has to reproduce locally to learn.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.log'
          if-no-files-found: ignore
