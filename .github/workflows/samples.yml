name: samples

# The samples are not in bobcat.sln, so tests.yml never touches them. That gap let nine projects
# rot undetected: each fails with "Bobcat / IStepContext / ThenAttribute could not be found",
# because they carry spec fixtures the host project has no reference to. Nothing reported it,
# because nothing built them.
#
# This job builds them, and since 2026-09-21 it RUNS them too.
#
# Compiling was never enough to call a sample fixed, and this job's own history is the argument:
# OutboxDemo compiled clean and could not start, because Wolverine 6 stopped shipping the runtime
# compiler. Worse, half the samples sat on WolverineFx 6.29.1 / Marten 9.28.0 and died on a
# TypeLoadException the first time they opened a session — for weeks, invisibly, because a build
# is all this job did. That is what running them catches.
#
# The samples are Microsoft.Testing.Platform hosts, so `dotnet test` runs them and one scenario is
# one test node. They need Postgres and nothing else: the only sample that wants a broker is
# BankAccountES, which is quarantined.
on:
  push:
    branches:
      - '**'
    paths:
      - 'samples/**'
      - 'src/**'
      - '.github/workflows/samples.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    # Same image and port as tests.yml, so "the database CI gives you" means one thing in this
    # repo. Each sample gets its OWN database below rather than sharing this one: MeetingGroupMonolith
    # puts its event store in a schema called `payments`, which is also the schema PaymentsMonolith
    # uses for everything, so a shared database would have the two of them creating mt_streams in
    # the same place and each one's between-scenario reset wiping the other's events. Harmless while
    # they run in sequence, and a trap the day anything runs them in parallel.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bobcat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A spec host publishes its progress to a monitor when one answers. Nothing listens here.
      BOBCAT_MONITOR: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build every sample project
        run: |
          # The ones that do not compile today, named individually rather than skipped as a
          # group. Started at nine. Two rules, and the second is the one that matters:
          #
          #   * a project outside this list that fails  -> new rot, fail the build
          #   * a project inside this list that BUILDS  -> the list is stale, fail the build
          #
          # A quarantine that only ever forgives is how a permanently-red job becomes background
          # noise. This one has to shrink: fix a sample, and CI tells you to delete its line.
          # Tracked by the "fix the samples" issue.
          #
          # 2026-09-21: Bobcat.Alba, Bobcat.Marten and Bobcat.Wolverine were deleted, and the
          # support is being rebuilt from what the samples actually need. Eight of the nine are
          # converted to raw Alba and out of this list.
          #
          # BankAccountES is the exception, and the reason is worth reading. Its AccountView and
          # FreezeAccount features are written ENTIRELY in the Bobcat.CritterStack Gherkin
          # grammar — `Given no events for Account`, `When FreezeAccount is received`,
          # `Then AccountFrozen is emitted` — so both fixtures were one line each:
          #
          #     public class FreezeAccountFixture : CritterStackFixture;
          #
          # That grammar went with the package. Converting the sample would mean re-implementing
          # the grammar inside it, which is the rebuild rather than a conversion — and
          # EventModel.feature asserts on the slices those two declare, so a hand-rolled
          # substitute would have to reproduce the type captures too. It stays here until the
          # grammar is rebuilt. It is the clearest evidence in the repo of what that grammar was
          # carrying.
          quarantined=(
            samples/BankAccountES/Tests/Tests.csproj
          )

          is_quarantined() {
            local needle="$1"
            for q in "${quarantined[@]}"; do [ "$q" = "$needle" ] && return 0; done
            return 1
          }

          regressions=()
          recovered=()

          while IFS= read -r project; do
            echo "::group::$project"
            if dotnet build "$project" -c Release --nologo; then
              if is_quarantined "$project"; then
                echo "::error file=$project::builds now — remove it from the quarantine list"
                recovered+=("$project")
              else
                echo "OK  $project"
              fi
            else
              if is_quarantined "$project"; then
                echo "known broken (quarantined): $project"
              else
                echo "::error file=$project::sample failed to build"
                regressions+=("$project")
              fi
            fi
            echo "::endgroup::"
          done < <(find samples -name '*.csproj' | sort)

          echo
          echo "===================== summary ====================="
          echo "quarantined: ${#quarantined[@]}"

          status=0

          if [ ${#regressions[@]} -gt 0 ]; then
            echo "${#regressions[@]} sample(s) newly broken:"
            printf '  %s\n' "${regressions[@]}"
            status=1
          fi

          if [ ${#recovered[@]} -gt 0 ]; then
            echo "${#recovered[@]} quarantined sample(s) now build — shrink the list:"
            printf '  %s\n' "${recovered[@]}"
            status=1
          fi

          [ $status -eq 0 ] && echo "no regressions"
          exit $status

      - name: Run every runnable sample's specs against Postgres
        run: |
          # Each sample names its own database, matching the default in its own Program.cs, so
          # nothing here has to know about another sample's schema choices. Created up front
          # because the service container only ever makes one.
          #
          # BankAccountES is absent on purpose: it is the quarantined project above, and it is the
          # one sample that also wants a broker.
          samples=(
            CqrsMinimalApi:cqrs_minimal_api
            BookingMonolith:booking
            CleanArchitectureTodos:clean_architecture_todos
            MoreSpeakers:more_speakers
            PaymentsMonolith:inflow
            EcommerceModularMonolith:ecommerce
            MeetingGroupMonolith:meeting_groups
            OutboxDemo:outbox_demo
          )

          for entry in "${samples[@]}"; do
            db="${entry#*:}"
            PGPASSWORD=postgres createdb -h localhost -p 5445 -U postgres "$db"
          done

          failed=()
          for entry in "${samples[@]}"; do
            name="${entry%%:*}"
            db="${entry#*:}"
            echo "::group::$name"
            if ConnectionStrings__Marten="Host=localhost;Port=5445;Database=$db;Username=postgres;Password=postgres" \
               dotnet test "samples/$name/Tests" -c Release; then
              echo "OK  $name"
            else
              echo "::error file=samples/$name::specs failed"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "${#failed[@]} sample(s) failed their specs:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "every runnable sample passed"

      # Off with the quarantine above — the project does not build until the CritterStack grammar
      # is rebuilt. Turn this back on in the same change that takes BankAccountES off the list.
      # `dotnet test`, not `dotnet run -- run`: the samples are MTP test hosts now, so a scenario
      # is a test node and the platform runs them.
      - name: Run the BankAccountES specs on Fisher (SQLite, no services)
        if: false
        env:
          EventStore: Fisher
          ConnectionStrings__Fisher: "Data Source=${{ runner.temp }}/bank_account.db"
          # The spec host would otherwise try to publish progress to a local viewer that is not running.
          BOBCAT_MONITOR: "0"
        run: dotnet test samples/BankAccountES/Tests -c Release
