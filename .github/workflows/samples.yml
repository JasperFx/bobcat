name: samples

# The samples are not in bobcat.slnx, so tests.yml never touches them. This job builds every
# sample project and runs the specs of every runnable one, through the Nuke build's Samples
# target (build/Samples.cs) — which is also where the reasoning lives: why building was never
# enough, the quarantine list and its "stale quarantine fails too" rule, the database per sample,
# and the BankAccountES Fisher leg. `./build.sh Docker Samples` runs the same thing locally.

on:
  push:
    branches:
      - '**'
    paths:
      - 'samples/**'
      - 'src/**'
      - 'build/**'
      - '.github/workflows/samples.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    # Same image and port as tests.yml, so "the database CI gives you" means one thing in this
    # repo. The Samples target creates one database per sample inside it; see build/Samples.cs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bobcat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A spec host publishes its progress to a monitor when one answers. Nothing listens here.
      BOBCAT_MONITOR: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and run every sample
        run: ./build.sh Samples
