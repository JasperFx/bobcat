name: ui frontend

# Typecheck + Vitest + production build gate for the Bobcat UI's Vue SPA (bobcat ui, bobcat#524),
# mirroring CritterWatch's frontend-unit workflow. The wire behind it is covered by Bobcat.Ui.Specs
# in the main test job, and the packed tool serving this page by ui-smoke.yml.
#
# The SPA's TypeScript mirrors of the C# wire contracts (src/messages/monitor-events.ts and
# relayRoutes.ts) are generated, not committed (bobcat#604): `./build.sh UiContracts` writes them
# from src/Bobcat.Ui/Contracts before anything here compiles, so this job type-checks, tests and
# builds the SPA against the contracts as they are now. That is why the path filter includes the
# C# contracts and the build: a changed record is a change to what this job compiles. A page that
# no longer matches the server it ships in is ui-smoke.yml's, which runs on src/** changes.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/Bobcat.Ui.FrontEnd/**'
      - 'src/Bobcat.Ui/Contracts/**'
      # The results file's records: the HTML results page's types are generated from its schema.
      - 'src/Bobcat/Rendering/**'
      - 'build/**'
      - '.github/workflows/ui-frontend.yml'

env:
  CI: true

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Bobcat.Ui.FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generated TypeScript contracts, through the Nuke target (build/Contracts.cs).
      - name: Generate the TypeScript contracts
        working-directory: .
        run: ./build.sh UiContracts

      # BOBCAT_UI_CONTRACTS_SKIP: the npm pre-hooks would regenerate them; the step above already
      # did, and the hooks then only check the files are there.
      - name: Install dependencies
        run: npm ci
        env:
          BOBCAT_UI_CONTRACTS_SKIP: '1'

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b

      - name: Unit tests (Vitest)
        run: npx vitest run

      # What EmbedFrontend runs inside the tool's pack. vue-tsc and Vitest both pass on code that
      # Vite then refuses to bundle (an import only the test environment resolves, a dynamic import
      # Rollup cannot split), and before this step that first showed up in the release's pack.
      - name: Production build (Vite)
        run: npx vite build

      # The HTML results page (bobcat#541): one self-contained file. Its build fails if the page
      # would reference anything beside itself.
      - name: Results page build (Vite, single file)
        run: npx vite build --config vite.config.results.ts
