name: publish

# Publishes the Bobcat NuGet packages. The version is centralized in
# src/Directory.Build.props (<Version>); bump it there to cut a release.
# Trigger by pushing a tag like `v0.5.0`, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # This job runs the full suite before packing, so it needs the same infrastructure the test
    # job has: the database the Marten integration tests use, and the real broker the
    # transport-isolation tests use (issue #282). Both fact attributes refuse to skip on CI, so a
    # service missing here fails the release rather than quietly passing. The broker was added to
    # tests.yml by #282 and not here, which would have failed the v0.19.0 tag at its test step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bobcat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5445:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5683:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      BOBCAT_POSTGRES: "Host=localhost;Port=5445;Database=bobcat_test;Username=postgres;Password=postgres"
      BOBCAT_RABBIT_HOST: "localhost"
      BOBCAT_RABBIT_PORT: "5683"
      # Same as tests.yml: spec hosts in the suite would otherwise probe for a viewer on 5525.
      BOBCAT_MONITOR: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # For the bobcat tool's embedded frontend build (EmbedFrontend below).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build -c Release -o ${{ github.workspace }}/artifacts

      # The bobcat dotnet tool packs separately: IsPackable is gated on EmbedFrontend
      # in its csproj, so the solution-level pack above skips it and this is the only way the
      # tool nupkg can exist — always with the Vite build embedded (npm ci + build run inside
      # this pack via the BuildFrontend target).
      - name: Pack bobcat (embedded frontend)
        run: >
          dotnet pack src/Bobcat.Console/Bobcat.Console.csproj
          -c Release -p:EmbedFrontend=true -o ${{ github.workspace }}/artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      # --skip-duplicate keeps the push idempotent for re-runs, but it also means a push
      # NuGet swallowed and a genuine duplicate look identical — both leave this job green.
      # That is how Bobcat.Console 0.11.0 sat invisible in nuget.org's validation pipeline
      # until a downstream consumer hit "not found" (issue #224). So verify the outcome,
      # not the request: poll the flat container until every packed id/version is actually
      # downloadable, and fail the release if any is still missing after the grace period.
      # This deliberately covers the bobcat tool too — the version is centralized in
      # src/Directory.Build.props, so the tool lagging the libraries is never a supported
      # state; a red run here means go look at the package's status on the nuget.org
      # account page. Validation normally clears in a few minutes; 30 is the generosity.
      # Waits for every pushed package to become downloadable. NuGet accepts a push long before
      # the package is restorable, so "pushed" is not "released" — a consumer that restores in
      # between gets the previous version and no error.
      #
      # Every outstanding package is checked on each pass, and the deadline covers the SET. The
      # previous shape computed one deadline and then looped packages one at a time, so the first
      # package spent the entire window and the remaining eleven were declared missing without ever
      # being given time: on 0.15.0 they all failed within one second of each other, half an hour
      # after the first one started waiting. The release was fine and shipped minutes later.
      - name: Verify packages are live on NuGet
        run: |
          set -euo pipefail

          outstanding=()
          for pkg in "${{ github.workspace }}"/artifacts/*.nupkg; do
            file=$(basename "$pkg" .nupkg)
            if [[ ! "$file" =~ ^(.+)\.([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Cannot parse a package id and version out of '$file'"
              exit 1
            fi
            # The flat container is addressed by lowercase id only — uppercase 404s.
            id=$(echo "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
            outstanding+=("$id ${BASH_REMATCH[2]}")
          done

          deadline=$(( $(date +%s) + 45 * 60 ))
          while true; do
            still=()
            for entry in "${outstanding[@]}"; do
              read -r id version <<< "$entry"
              if curl -sf "https://api.nuget.org/v3-flatcontainer/$id/index.json" \
                  | jq -e --arg v "$version" 'any(.versions[]; . == $v)' > /dev/null; then
                echo "$id $version is live"
              else
                still+=("$entry")
              fi
            done

            outstanding=("${still[@]:-}")
            [[ -z "${outstanding[0]:-}" ]] && break

            if (( $(date +%s) >= deadline )); then
              break
            fi

            echo "waiting on ${#outstanding[@]}: ${outstanding[*]} — retrying in 30s..."
            sleep 30
          done

          if [[ -n "${outstanding[0]:-}" ]]; then
            for entry in "${outstanding[@]}"; do
              read -r id version <<< "$entry"
              echo "::error::$id $version was pushed but is not downloadable from nuget.org — likely still in validation, or rejected; check the package's status on the nuget.org account page"
            done
            echo "::error::Release is incomplete — ${#outstanding[@]} package(s) never became downloadable"
            exit 1
          fi
