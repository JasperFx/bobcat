name: publish event-model-vue

# Publishes @jasperfx/event-model-vue (src/Bobcat.EventModel.FrontEnd) to npmjs.com — the shared
# Event Modeling renderer both the Bobcat console and CritterWatch consume (issue #108;
# CritterWatch#1121 is blocked on exactly this publication). Manual dispatch only, mirroring the
# NuGet publish's posture: the version is whatever package.json says, so bump it there to cut a
# release. The publish step is guarded — an already-published version fails fast rather than
# republishing, and the full typecheck + test + build gate runs first (the same steps as
# event-model-frontend.yml, which must stay green on its own terms).
#
# Requires:
#   - the `jasperfx` org on npmjs.com (the @jasperfx scope), with publish rights for the token
#   - an automation token in the NPM_TOKEN repo secret
# `--provenance` links the published tarball to this workflow run (needs id-token: write and the
# repository field in package.json — both in place).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Bobcat.EventModel.FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Refuse to republish an existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npmjs.com — bump the version in package.json to cut a release."
            exit 1
          fi
          echo "Publishing $NAME@$VERSION"

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Library build
        run: npx vite build

      - name: Publish to npmjs.com
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
