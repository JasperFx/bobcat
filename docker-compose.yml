# Local services for the Bobcat integration tests.
#
#   docker compose up -d
#   dotnet test
#
# Published on 5445, well away from 5432, so it never fights a Postgres you already run — the
# default connection string points here. Override with BOBCAT_POSTGRES to use your own database
# instead. Without one the Marten integration tests skip locally (saying so); never on CI, where
# the workflow supplies a Postgres service and a missing database fails the build.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bobcat_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RabbitMQ for the transport-isolation tests (issue #282).
  #
  # A REAL broker, deliberately. The defect it exists to catch — messages a scenario cascaded
  # surviving the per-scenario reset and being delivered inside the NEXT scenario — is invisible to
  # an in-memory transport, because a local queue has nowhere to survive. That is exactly why it
  # shipped: every sample either stubs the transport or does not cascade across one inside a
  # scenario, so nothing in the suite could see it.
  #
  # 5683/15683 to sit beside any RabbitMQ you already run — the same reasoning as Postgres on 5445,
  # and 5673 was already taken by a Wolverine emulator on this machine when it was picked.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5683:5672"
      - "15683:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
